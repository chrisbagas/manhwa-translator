name: android

on:
  push:
    paths:
      - 'android/**'
      - 'extension/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: extension/assets/models
          key: models-${{ hashFiles('extension/scripts/fetch-models.mjs') }}

      - name: Build web assets (content script + on-phone engine + models)
        working-directory: extension
        run: |
          npm ci --no-audit --no-fund
          node scripts/fetch-models.mjs
          node scripts/build.mjs --targets android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: dalbit-android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
