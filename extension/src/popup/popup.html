<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dalbit</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header><strong>Dalbit</strong><span id="status" class="status">checking…</span></header>
  <button id="translate" class="primary">Translate chapter</button>
  <div class="row">
    <button id="toggle">Original / translated</button>
    <button id="scan" title="Scrolls through the page to load lazy images, then returns">Scan page</button>
  </div>
  <p id="msg" class="msg" hidden></p>

  <details id="settings">
    <summary>Settings</summary>
    <label>Engine
      <select id="engine">
        <option value="builtin">Built-in (runs in the browser, nothing to install)</option>
        <option value="service">Local service (faster on big chapters; needs Python)</option>
      </select>
    </label>
    <label>Target language
      <select id="targetLang"><option value="en">English</option></select>
    </label>
    <label>Text size <span id="textScaleVal"></span>
      <input id="textScale" type="range" min="0.7" max="1.5" step="0.05">
    </label>
    <label>Sound effects
      <select id="sfxMode">
        <option value="annotate">Preserve + annotate (default)</option>
        <option value="original">Original only</option>
        <option value="replace">Replace (experimental; currently annotates)</option>
      </select>
    </label>
    <label>Glossary <small>(one per line: 민준 = Minjun)</small>
      <textarea id="glossary" rows="3" spellcheck="false"></textarea>
    </label>
    <div id="serviceFields">
      <label>Pairing token <small>(<code>python -m dalbit token</code>)</small>
        <input id="token" type="password" autocomplete="off">
      </label>
      <label>Service URL <small>(loopback only)</small>
        <input id="serviceUrl" type="url">
      </label>
    </div>
    <button id="save">Save settings</button>
    <button id="grant" hidden>Allow access to page images</button>
  </details>
  <script src="popup.js"></script>
</body>
</html>
